<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gigi 63 | Boutique</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  background: #fff;
  color: #333;
}
header {
  background: #f6e6ea;
  padding: 20px;
  text-align: center;
}
header h1 {
  font-size: 48px;
  margin: 0;
}
nav a {
  margin: 0 15px;
  text-decoration: none;
  color: #333;
  font-weight: bold;
}
.hero {
  padding: 60px;
  text-align: center;
}
.hero h2 {
  font-size: 32px;
}
.shop {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 40px;
}
.product {
  border: 1px solid #eee;
  padding: 20px;
  text-align: center;
}
.product h3 {
  margin: 10px 0;
}
button {
  background: #d4af37;
  color: white;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
}
footer {
  background: #f6e6ea;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>Gigi 63</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Effortless Style, Timeless Elegance</h2>
  <button>Shop Now</button>
</section>

<section class="shop">
  <div class="product">
    <h3>Blush Summer Dress</h3>
    <p>$59</p>
    <button>Add to Cart</button>
  </div>
  <div class="product">
    <h3>Satin Blouse</h3>
    <p>$39</p>
    <button>Add to Cart</button>
  </div>
  <div class="product">
    <h3>Beige High-Waist Pants</h3>
    <p>$49</p>
    <button>Add to Cart</button>
  </div>
  <div class="product">
    <h3>Gold Chain Handbag</h3>
    <p>$45</p>
    <button>Add to Cart</button>
  </div>
</section>

<footer>
  © 2025 Gigi 63 — All Rights Reserved
</footer>

</body>
</html>
